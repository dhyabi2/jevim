name: jevim
version: 0.1.0
description: "All-in-one browser automation for Hermes, running on your own machine from this open-source repo: an autonomous browser agent (real Chrome), element grounding, form fill, page survey, and replayable fingerprint-pinned scripts that need no model. No hosted service required."
author: dhyabi2
provides_tools:
  - jevim_canon
  - jevim_canon_confirm
  - jevim_browse
  - jevim_index
  - jevim_ground
  - jevim_form_fill
  - jevim_survey
  - jevim_script_author
  - jevim_script_run
  - jevim_test_run
